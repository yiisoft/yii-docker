name: changelog

on:
  pull_request:
    paths:
      - 'Dockerfile-debian'
      - 'docker-compose.yml'
      - 'docker-compose.apache.yml'
      - 'docker-compose.fpm-nginx.yml'
      - 'image-files/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    uses: yiisoft/actions/.github/workflows/changelog.yml@master
